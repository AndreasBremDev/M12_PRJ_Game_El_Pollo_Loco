    <script>
        let intervalIds = [];
        function stopGame() {
            intervalIds.forEach(clearInterval);
        }
        function setStoppableInterval(fn, time) {
            let id = setInterval(fn, time);
            intervalIds.push(id);
            return id;
        }
    </script>
